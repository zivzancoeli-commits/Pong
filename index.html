<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pong</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #1e1e1e;
    }

    canvas {
      display: block;
      margin: auto;
      image-rendering: pixelated;
      width: min(100vw, calc(100vh * 4 / 3));
      height: min(100vh, calc(100vw * 3 / 4));
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>

<body>
  <canvas id="game" width="640" height="480"></canvas>

  <!-- Load order matters: files that make variables go first, game.js last -->
  <script>const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
var playing = false;
var lost = false;
var boardWidth = 20;
var boardHeight = 15;
var ballX = 10;
var ballY = 7;
var dirY = 1;
var dirX = -1;
var ballSize = 25;
var cellWidth = canvas.width / boardWidth;
var cellHeight = canvas.height / boardHeight;
var paddleY = 7;
var score = 0;
var firstMovement = 1;
var backBallX = 10;
var backBallY = 7;
var backDirY = 1;
var backDirX = -1;
var leftPaddleY = 7;
var rightPaddleY = 7;
var backCanvasWidth = canvas.width - 30;
var backCanvasHeight = canvas.height - 30;
var backCellWidth = backCanvasWidth / boardWidth;
var backCellHeight = backCanvasHeight / boardHeight;
var lastMoveRight = 0;
var lastMoveLeft = 0;
var keys = {};
document.addEventListener("keydown", function (event) {
    keys[event.key] = true;
});
document.addEventListener("keyup", function (event) {
    keys[event.key] = false;
});
canvas.addEventListener("click", function (event) {
    var rect = canvas.getBoundingClientRect();
    var mouseX = (event.clientX - rect.left) * (canvas.width / rect.width);
    var mouseY = (event.clientY - rect.top) * (canvas.height / rect.height);
    if (mouseX > canvas.width / 2 - 150 && mouseX < canvas.width / 2 - 150 + 300 && mouseY > canvas.height / 2 - 35 && mouseY < canvas.height / 2 + 35 && playing === false) {
        score = 0;
        ballX = 10;
        ballY = 7;
        dirX = -1;
        paddleY = 7;
        firstMovement = 1;
        playing = true;
        lost = false;
    }
    if (mouseX > canvas.width / 2 - 150 && mouseX < canvas.width / 2 - 150 + 300 && mouseY > canvas.height / 2 + 70 && mouseY < canvas.height / 2 + 140 && lost && playing === false) {
        score = 0;
        ballX = 10;
        ballY = 7;
        dirX = -1;
        paddleY = 7;
        firstMovement = 1;
        playing = false;
        lost = false;
    }
});
function movement() {
    if (ballX < 2) {
        dirX *= -1;
    }
    if (ballX > boardWidth - 4 && ballY >= paddleY - 1 && ballY <= paddleY + 1) {
        dirX *= -1;
        score += 1;
    } else if (ballX > boardWidth - 4) {
        lost = true;
        playing = false;
    }
    if (ballY > boardHeight - 2 || ballY < 1) {
        dirY *= -1;
    }
    ballX = ballX + dirX;
    ballY = ballY + dirY;
}
function gameLoop() {
    if (keys["w"] || keys["ArrowUp"]) {
        if (paddleY > 1) {
            paddleY -= 1;
        }
        firstMovement += 1;
    }
    if (keys["s"] || keys["ArrowDown"]) {
        if (paddleY < boardHeight - 2) {
            paddleY += 1;
        }
        firstMovement += 1;
    }
    if (playing && lost === false) {
        if (firstMovement > 1) {
            movement();
        }
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "rgb(255, 255, 255)";
        ctx.fillRect(ballX * cellWidth, ballY * cellHeight, cellWidth, cellHeight);
        ctx.fillStyle = "rgb(125, 125, 125)"
        ctx.fillRect(0, 0, cellWidth, canvas.height);
        ctx.fillRect(cellWidth * (boardWidth - 2), (paddleY * cellHeight) - cellHeight, cellWidth, cellHeight * 3)
        ctx.fillStyle = "white";
        ctx.font = "24px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Score: " + score, canvas.width / 2, 40);
    }
    if (lost && playing === false) {
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "white";
        ctx.font = "48px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Score: " + score, canvas.width / 2, 100);
        // draw buttons
        ctx.fillRect(canvas.width / 2 - 150, canvas.height / 2 - 35, 300, 70); // start
        
        ctx.fillRect(canvas.width / 2 - 150, canvas.height / 2 + 70, 300, 70); // back
        ctx.fillStyle = "black";
        ctx.font = "30px sans-serif";
        ctx.fillText("Start", canvas.width / 2, canvas.height / 2 + 10) // start
        ctx.fillText("Back", canvas.width / 2, canvas.height / 2 + 115) // back
    }
    if (lost === false && playing === false) {
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "rgba(255, 255, 255, 0.4)"
        if (backBallX < 4 || backBallX > boardWidth - 4) {
            backDirX *= -1;
        }
        if (backBallY > boardHeight - 2 || backBallY < 1) {
            backDirY *= -1;
        }
        ctx.fillRect(backBallX * backCellWidth, backBallY * backCellHeight, backCellWidth, backCellHeight);
        ctx.fillRect(backCellWidth * (boardWidth - 2), (rightPaddleY * backCellHeight) - backCellHeight, backCellWidth, backCellHeight * 3) // right
        ctx.fillRect(backCellWidth * 2, (leftPaddleY * backCellHeight) - backCellHeight, backCellWidth, backCellHeight * 3) // left
        if (backDirX === 1) {
            if (backBallY < rightPaddleY) {
                rightPaddleY -= 1;
            } else if (backBallY > rightPaddleY) {
                rightPaddleY += 1;
            }
            if (Math.random() > 0.5 && lastMoveLeft === 1) {
                leftPaddleY += 1;
                lastMoveLeft = 0;
            } else if (lastMoveRight === 1) {
                leftPaddleY -= 1;
                lastMoveLeft = 0;
            } else {
                lastMoveLeft = 1;
            }
        } else {
            if (backBallY < leftPaddleY) {
                leftPaddleY -= 1;
            } else if (backBallY > leftPaddleY) {
                leftPaddleY += 1;
            }
            if (Math.random() > 0.5 && lastMoveRight === 1) {
                rightPaddleY += 1;
                lastMoveRight = 0;
            } else if (lastMoveRight === 1) {
                rightPaddleY -= 1;
                lastMoveRight = 0;
            } else {
                lastMoveRight = 1;
            }
        }
        if (leftPaddleY > boardHeight - 2) {
            leftPaddleY = boardHeight - 2;
        }
        if (leftPaddleY < 1) {
            leftPaddleY = 1;
        }
        if (rightPaddleY > boardHeight - 2) {
            rightPaddleY = boardHeight - 2;
        }
        if (rightPaddleY < 1) {
            rightPaddleY = 1;
        }
        backBallX += backDirX;
        backBallY += backDirY;
        ctx.fillStyle = "white";
        ctx.fillRect(canvas.width / 2 - 150, canvas.height / 2 - 35, 300, 70); // start
        ctx.fillStyle = "black";
        ctx.font = "30px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Start", canvas.width / 2, canvas.height / 2 + 10) // start
        ctx.font = "96px sans-serif";
        ctx.fillStyle = "white";
        ctx.fillText("Pong", canvas.width / 2, 120);
    }
}
setInterval(gameLoop, 200);</script>

</body>

</html>
